
<!doctype html>

<html lang="da">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TALK</title>

<style>

html,body,iframe{

  width:100%;

  height:100%;

  margin:0;

  border:0;

  background:#0c1814;

}

</style>

</head>

<body>

<iframe id="talk" allow="camera; microphone"></iframe>

<script>

fetch("https://iuuvepbgrrtjjeiktipe.supabase.co/storage/v1/object/public/talk-public/index.html?v=" + Date.now())

  .then(r => r.text())

  .then(html => {

    document.getElementById("talk").src =

      "data:text/html;charset=utf-8," + encodeURIComponent(html);

  })

  .catch(() => {

    document.body.innerHTML =

      "<h1 style='color:white;font-family:Arial;padding:30px'>TALK kunne ikke starte</h1>";

  });

</script>

</body>

</html>
