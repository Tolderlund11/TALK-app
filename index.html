
<!doctype html>

<html lang="da">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>TALK</title>

  <style>

    body {

      margin: 0;

      background: #0c1814;

      color: white;

      font-family: Arial, sans-serif;

      text-align: center;

      padding-top: 80px;

    }

  </style>

</head>

<body>

  <h1>Starter TALK…</h1>

  <script>

    fetch("https://iuuvepbgrrtjjeiktipe.supabase.co/storage/v1/object/public/talk-public/index.html?v=" + Date.now())

      .then(response => {

        if (!response.ok) throw new Error("Kunne ikke hente TALK");

        return response.text();

      })

      .then(html => {

        document.open();

        document.write(html);

        document.close();

      })

      .catch(() => {

        document.body.innerHTML =

          "<h1>TALK kunne ikke starte</h1><p>Prøv at genindlæse siden.</p>";

      });

  </script>

</body>

</html>
