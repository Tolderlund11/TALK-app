
<!doctype html>

<html lang="da">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>TALK</title>

  <style>

    html,body,#talk {

      width:100%;

      height:100%;

      margin:0;

      border:0;

      background:#0c1814;

    }

    #status {

      color:white;

      font-family:Arial,sans-serif;

      text-align:center;

      padding-top:80px;

    }

  </style>

</head>

<body>

  <div id="status"><h1>Starter TALK…</h1></div>

  <script>

    fetch("https://iuuvepbgrrtjjeiktipe.supabase.co/storage/v1/object/public/talk-public/index.html?v=" + Date.now())

      .then(response => response.text())

      .then(html => {

        document.body.innerHTML = "";

        const frame = document.createElement("iframe");

        frame.id = "talk";

        frame.srcdoc = html;

        frame.allow = "camera; microphone";

        document.body.appendChild(frame);

      })

      .catch(() => {

        document.getElementById("status").innerHTML =

          "<h1>TALK kunne ikke starte</h1><p>Prøv igen.</p>";

      });

  </script>

</body>

</html>
